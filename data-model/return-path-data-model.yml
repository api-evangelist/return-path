note: >-
  Entity graph derived from the Everest API's own path structure and the
  response examples Validity publishes in its collection. Every entity and field
  named here appears verbatim in a published example or a published path
  parameter; relationships are read from path nesting (an entity reached under
  /parent/{id}/child belongs to that parent) and from id-reference fields inside
  the examples. Ids are plain integers or opaque hex keys — Everest publishes no
  typed id prefixes.
id_conventions:
  numeric: >-
    Most entities use a bare integer `id` (inbox tests, reputation profiles,
    validation lists, VTO campaigns, analytics pixels, prospect searches).
  opaque_key: >-
    Webhook endpoints and API keys are addressed by an opaque alphanumeric
    `key`, which is also the URL path segment and, for webhooks, the receiving
    URL segment.
  natural_key: >-
    DMARC/infrastructure domains are addressed by the domain name itself
    (/2.0/infrastructure/domains/{domain}), not a surrogate id.
