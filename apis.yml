name: Return Path
description: >-
  Return Path is an email-deliverability and inbox-intelligence brand that
  pioneered sender reputation, inbox-placement monitoring, and email fraud
  protection for marketers and email senders. Founded in 1999 and backed by
  Sapphire Ventures and Union Square Ventures, Return Path was acquired by
  Validity in 2019 and now ships as the Validity Everest email-success platform;
  returnpath.com 301-redirects to validity.com. The platform draws on signals
  from billions of global mailboxes to measure inbox placement, sender
  reputation, and deliverability across major mailbox providers. The Return Path
  product line's surviving API surface is the Everest API at
  api.everest.validity.com — 170 published operations across inbox placement,
  sender reputation and Sender Score, blocklist and spam-trap monitoring, DMARC
  infrastructure reporting, engagement analytics, list validation and
  certification. Validity publishes no OpenAPI, but it does publish a complete
  public Postman collection at developer.everest.validity.com, which is the
  machine-readable contract this profile is built from.
