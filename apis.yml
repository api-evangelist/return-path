apis:
- name: Everest API
  description: >-
    The Everest API by Validity — the Return Path platform's surviving
    programmable surface. Two live major versions behind one host: /api/2.0 is
    current and covers inbox placement testing and seed lists, sender reputation
    profiles, Sender Score, blocklist listings, spam-trap events, DMARC
    infrastructure reporting, engagement and delivery analytics, list
    validation, View Time Optimization and certification performance; /api/1.0
    is the legacy surface that still carries Account Services (aliases, child
    accounts, API keys, GDPR requests, webhook endpoints). Authenticated with a
    static X-API-KEY header, limited to 500 requests per minute per account.
  humanURL: https://developer.everest.validity.com/
  baseURL: https://api.everest.validity.com/api
