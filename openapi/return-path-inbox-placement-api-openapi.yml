  /2.0/inbox/seeds:
    get:
      operationId: seedListsSeedList
      summary: Seed List
      tags:
      - Inbox Placement
      description: Seed List returns a full list of seed addresses for an account.
      x-api-version: '2.0'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      pages:
                        type: integer
                      total:
                        type: integer
                  results:
                    type: array
                    items:
                      type: string
              examples:
                Seed List:
                  value:
                    meta:
                      pages: 1
                      total: 3
                    results:
                    - seed1@domain.com
                    - seed2@domain.com
                    - seed3@domain.com
        '401':
          description: Unauthorized — no valid API key provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the key lacks access to this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found — invalid parameters or missing API endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests — API rate limit reached, retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: seedListsUpdateSeedList
      summary: Update Seed List
      tags:
      - Inbox Placement
      x-api-version: '2.0'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                regions:
                  type: string
                  description: (Required) Either an array or comma separated list of region ids.
            example:
              regions: 1,2,3,6,7,8,9,13,15
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      status:
                        type: string
              examples:
                Update Seed List:
                  value:
                    results:
                      status: success
        '401':
          description: Unauthorized — no valid API key provided
          content:
            application/json:
              schema:
