                                pct:
                                  type: integer
                            accept_all:
                              type: object
                              properties:
                                count:
                                  type: integer
                                pct:
                                  type: integer
                            role_address:
                              type: object
                              properties:
                                count:
                                  type: integer
                                pct:
                                  type: integer
                            unknown:
                              type: object
                              properties:
                                count:
                                  type: integer
                                pct:
                                  type: integer
                        endpoints:
                          type: object
                          properties:
                            all:
                              type: string
                            valid:
                              type: string
                            email_address_invalid:
                              type: string
                            email_domain_invalid:
