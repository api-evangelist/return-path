    post:
      operationId: createCampaign
      summary: Create Campaign
      tags:
      - View Time Optimization
      x-api-version: '2.0'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: You can select to have all mail matching a specific from address to be optimized
                    through VTO delivery as long as the DKIM domain and selector also match
                subject:
                  type: string
                  description: Please provide the exact subject line string when provisioning campaigns. Please
                    note that emojis or other special characters might result in issues.We recommend to check the
                    exact subject string as it appears within a mail header by sending yourself a test email.
                identificationmethod:
                  type: string
                  description: Available options are 'body-tag', 'subject', 'xheader-generate'.
                dkimdomain:
                  type: string
                dkimselector:
                  type: string
                starttime:
                  type: string
                  description: The start date of the campaign In UTC
                endtime:
                  type: string
                  description: An ideal campaign should run for at least 48 hours to take advantage of the VTO benefits.
                    Maximum duration is 30 days
                endresolutionmode:
                  type: string
                  description: |-
                    A unique option of VTO campaigns is the ability to decide what to do with undelivered emails at the end of the campaign run time. Undelivered means recipients for that specific campaigns have notcome online during the campaign run time.

                    'sendAll': Deliver all undelivered mail to the inbox (referred to as "Draining"; attempts normal delivery pattern)

                    'ignore': Discard all undelivered mail
                optinforabtest:
                  type: string
                  description: Available options are 0 or 1. If we enable an A/B test we will automatically select
                    a subset of the recipients targeted for a VTOcampaign and deliver emails without VTO optimization
                    while the bulk of the emails will be optimizedthrough VTO.
            example:
              from: validity@reply.validity.com
              subject: This is a subject line!
              identificationmethod: subject
              dkimdomain: reply.validity.com
              dkimselector: dkimselector1
              starttime: '2020-10-08 04:38:00'
              endtime: '2020-10-14 04:38:00'
              endresolutionmode: sendAll
              optinforabtest: '1'
      responses:
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              examples:
                Create Campaign Error Invalid identificationmethod:
                  value:
                    status: 'Bad Request: The ''identificationmethod'' value must equal ''body-tag'', ''subject'',
                      ''xheader-custom'' or ''xheader-generate'''
                Create Campaign Error Invalid optinforabtest:
                  value:
                    status: 'Bad Request: The optinforabtest field must be one of: 0,1.'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      params:
                        type: object
                        properties:
                          identificationmethod:
                            type: string
                          messagecap: {}
                          vtoheadername: {}
                          vtoheadervalue: {}
                          dkimselector:
                            type: string
                          dkimdomain:
                            type: string
                          description: {}
                          from:
                            type: string
                          starttime:
                            type: string
                          endtime:
                            type: string
                          endresolutionmode:
                            type: string
                          optinforabtest:
                            type: string
                          subject:
                            type: string
                  results:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
              examples:
                Create Campaign:
                  value:
                    meta:
                      params:
                        identificationmethod: subject
                        messagecap: null
                        vtoheadername: null
