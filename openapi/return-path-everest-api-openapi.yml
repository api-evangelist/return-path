                        reasons: []
                        risk: very_high
                        recommendation: suppress
                      email_domain_invalid:
                        category: email_domain_invalid
                        status: invalid
                        name: Domain Invalid
                        definition: The email address is associated with a domain that doesn't exist. For example,
                          evereeeeest.validity.com is not a real domain capable of sending and receiving email.
                          So inbox@evereeeeest.validity.com is an invalid email since it pertains to a domain that
                          does not exists.
                        reasons: []
                        risk: very_high
                        recommendation: suppress
                      mailbox_full:
                        category: mailbox_full
                        status: invalid
                        name: Mailbox Full
                        definition: The mailbox is full.
                        reasons:
                        - summary: Mailbox is full
                          details: The mailbox is full.
                        risk: medium
                        recommendation: suppress
                      email_account_invalid:
                        category: email_account_invalid
                        status: invalid
                        name: Account Invalid
                        definition: The email account (the inbox) does not exist at the given domain. For example,
                          not-an-inbox@everest.validity.com results in a secondary status of Email Account Invalid.
                        reasons: []
                        risk: very_high
                        recommendation: suppress
                      accept_all:
                        category: accept_all
                        status: risky
                        name: Accept-All
                        definition: Accept-All emails are when a server is set to receive all emails at a specific
                          domain, meaning these domains accept any email you send to them at first. So it appears
                          as if all of the emails are Valid at that domain, but the company actually has a firewall
                          or another spam tool that may remove the email message or send a bounce message at a later
                          time.
                        reasons:
                        - summary: Address acccepts all mail
                          details: Some domains do not distinguish between existing and non-existing addresses and
                            accept all mail.
                        risk: medium
                        recommendation: caution
                      role_address:
                        category: role_address
                        status: risky
                        name: Role Address
                        definition: Email address was created to message a function like sales@, support@, or postmaster@.
                          While many Role Addresses are Valid, they typically underperform compared to addresses
                          that message individuals. Unless you’re marketing to small businesses, Role addresses
                          will often dilute the performance of your marketing program.
                        reasons:
                        - summary: Address matches known role email accounts such as sales@company or customerservice@company
                          details: Role addresses belong to the end user and are deliverable, but include multiple
                            end recipients as part of a larger distribution list. These kinds of addresses are usually
                            not good for sending campaigns.
                        risk: medium
                        recommendation: caution
                      disposable:
                        category: disposable
                        status: risky
                        name: Disposable
                        definition: 'Email address is disposable and the Inbox will self-destruct. Disposable addresses
                          are created to be Valid only temporarily so their owners can sign up for promotions or
                          services without using a primary address. Disposable addresses will not perform and typically
                          just take up space in your database. '
                        reasons:
                        - summary: Address matches series of known disposable or temporary addresses in our database,
                            like 10minutemail.com or 12houremail.com
                          details: Disposable addresses are short-term email addresses that disappear or expire
                            after a set time period. Therefore, these addresses are usually not good for sending
                            campaigns.
                        risk: medium
                        recommendation: caution
                      unknown:
                        category: unknown
                        status: risky
                        name: Unknown
                        definition: The email address looks good but the associated domain is not responding. This
                          could be a temporary status for domains having intermittent issues or a permanent issue
                          for dying domains.
                        reasons:
                        - summary: Unable to connect to email server
                          details: Unable to connect and resolve to service during SMTP connection.
                        - summary: Unresponsive SMTP server
                          details: Unable to successfully get a response from SMTP server.
                        - summary: Other unknown anomalies
                          details: Address was outside known result definitions and criteria and was unable to be
                            classified.
                        risk: medium
                        recommendation: caution
