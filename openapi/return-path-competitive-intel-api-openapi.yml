        schema:
          type: string
        example: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      params:
                        type: object
                        properties:
                          authenticated:
                            type: boolean
                      typo:
                        type: string
                      grey:
                        type: string
                      pristine:
                        type: string
                  results:
                    type: object
                    properties:
                      total:
                        type: integer
                      type:
                        type: object
                        properties:
                          pristine:
                            type: integer
                          typo:
                            type: integer
                          recycled:
