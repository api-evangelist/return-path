note: >-
  Lifecycle posture for the Everest API, the Return Path platform's surviving
  API surface. Validity runs two live major versions side by side and commits to
  keeping the older one, but publishes no dated deprecation policy, no Sunset
  header support and no status page.
versioning:
  scheme: uri-path
  current: '2.0'
  supported: ['2.0', '1.0']
  docs: https://developer.everest.validity.com/
  policy_quote: >-
    "It's important to note that V2 of our API is purely optional. We hope you
    find it simpler to use, more intuitive, and better documented, but we plan
    to continue supporting API V1."
  note: >-
    V1 and V2 are not equivalent surfaces. Account Services (aliases, child
    accounts, GDPR requests, the original webhook registry) is published only
    under /api/1.0; everything else — inbox placement, reputation, DMARC
    infrastructure, engagement analytics, list validation, certification — is
    published under /api/2.0. A consumer needs both.
